# One-machine deployment: the app plus PostgreSQL.
#   1. cp .env.example .env   and fill in the values
#   2. docker compose up -d --build
# Put a reverse proxy with HTTPS (Caddy, nginx, a cloud load balancer) in front of port 4000.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: abg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: abg
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abg -d abg"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://abg:${POSTGRES_PASSWORD}@db:5432/abg
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env (https://your-domain)}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-ABG Tracker <no-reply@localhost>}

volumes:
  dbdata:
